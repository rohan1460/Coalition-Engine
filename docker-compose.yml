services:
  neo4j:
    image: neo4j:5-community
    container_name: coalition-neo4j
    ports:
      - "7474:7474"   # HTTP browser UI  -> http://localhost:7474
      - "7687:7687"   # Bolt driver protocol
    environment:
      # Must match NEO4J_USER / NEO4J_PASSWORD in your .env
      NEO4J_AUTH: neo4j/password123
      NEO4J_server_memory_pagecache_size: 256M
      NEO4J_server_memory_heap_max__size: 512M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data:
  neo4j_logs:
